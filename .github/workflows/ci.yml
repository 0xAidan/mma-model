name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Ruff evaluation (strict)
        run: >
          ruff check
          src/mma_model/evaluation
          tests/test_evaluation_contract.py
          tests/test_evaluation_contract_packaging.py
          --select E,F,I,UP,B,SIM
      - name: Ruff markets (strict)
        run: >
          ruff check
          src/mma_model/domain
          src/mma_model/markets
          tests/markets
          --select E,F,I,UP,B,SIM
      - name: Ruff odds (strict)
        run: >
          ruff check
          src/mma_model/odds
          src/mma_model/db/tables/odds.py
          src/mma_model/db/odds_guards.py
          tests/odds
          --select E,F,I,UP,B,SIM
      - name: Ruff value (strict)
        run: >
          ruff check
          src/mma_model/value
          tests/value
          tests/test_value.py
          --select E,F,I,UP,B,SIM
      - name: Ruff modeling (strict)
        run: >
          ruff check
          src/mma_model/modeling/artifacts.py
          src/mma_model/modeling/baselines.py
          src/mma_model/modeling/joint.py
          src/mma_model/modeling/calibration.py
          src/mma_model/modeling/uncertainty.py
          src/mma_model/modeling/metrics.py
          src/mma_model/modeling/registry.py
          src/mma_model/modeling/promotion.py
          src/mma_model/modeling/__init__.py
          src/mma_model/markets/derive.py
          tests/modeling/test_baselines.py
          tests/modeling/test_joint.py
          tests/modeling/test_calibration.py
          tests/modeling/test_registry.py
          --select E,F,I,UP,B,SIM
      - name: Ruff backtest (strict)
        run: >
          ruff check
          src/mma_model/backtest
          src/mma_model/predict/backtest.py
          tests/backtest
          --select E,F,I,UP,B,SIM
      - name: Ruff recommend (strict)
        run: >
          ruff check
          src/mma_model/recommend
          tests/recommend
          --select E,F,I,UP,B,SIM
      - name: Ruff grade (strict)
        run: >
          ruff check
          src/mma_model/db/tables/recommendations.py
          src/mma_model/grade
          src/mma_model/db/grade_guards.py
          tests/grade
          --select E,F,I,UP,B,SIM
      - name: Ruff jobs (strict)
        run: >
          ruff check
          src/mma_model/jobs/orchestrator.py
          src/mma_model/jobs/due.py
          src/mma_model/jobs/handlers.py
          src/mma_model/jobs/ledger.py
          src/mma_model/jobs/types.py
          src/mma_model/db/tables/pipeline_jobs.py
          tests/jobs/test_orchestrator.py
          --select E,F,I,UP,B,SIM
      - name: Ruff observability (strict)
        run: >
          ruff check
          src/mma_model/observability
          tests/observability
          --select E,F,I,UP,B,SIM
      - name: Ruff publish (strict)
        run: >
          ruff check
          src/mma_model/publish
          tests/publish
          src/mma_model/jobs/handlers.py
          src/mma_model/observability/publish_guard.py
          src/mma_model/cli.py
          --select E,F,I,UP,B,SIM
      - name: Ruff weekly lifecycle (strict)
        run: >
          ruff check
          tests/integration
          tests/fixtures/week_lifecycle
          scripts/run_weekly_smoke.py
          src/mma_model/jobs/handlers.py
          --select E,F,I,UP,B,SIM
      - name: Pytest
        run: pytest -q
      - name: Web typecheck (dashboard contracts)
        run: |
          npm --prefix web ci
          npm --prefix web run typecheck
