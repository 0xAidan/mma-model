name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.6.14"
      - name: Install Python deps (locked)
        run: |
          uv pip install --system -r requirements-dev.txt
          uv pip install --system --no-deps -e .
      - name: Ruff
        run: ruff check .
      - name: Ruff evaluation (strict)
        run: >
          ruff check
          src/mma_model/evaluation
          tests/test_evaluation_contract.py
          tests/test_evaluation_contract_packaging.py
          --select E,F,I,UP,B,SIM
      - name: Ruff markets (strict)
        run: >
          ruff check
          src/mma_model/domain
          src/mma_model/markets
          tests/markets
          --select E,F,I,UP,B,SIM
      - name: Ruff odds (strict)
        run: >
          ruff check
          src/mma_model/odds
          src/mma_model/db/tables/odds.py
          src/mma_model/db/odds_guards.py
          tests/odds
          --select E,F,I,UP,B,SIM
      - name: Ruff value (strict)
        run: >
          ruff check
          src/mma_model/value
          tests/value
          tests/test_value.py
          --select E,F,I,UP,B,SIM
      - name: Ruff modeling (strict)
        run: >
          ruff check
          src/mma_model/modeling/artifacts.py
          src/mma_model/modeling/baselines.py
          src/mma_model/modeling/joint.py
          src/mma_model/modeling/calibration.py
          src/mma_model/modeling/uncertainty.py
          src/mma_model/modeling/metrics.py
          src/mma_model/modeling/registry.py
          src/mma_model/modeling/promotion.py
          src/mma_model/modeling/__init__.py
          src/mma_model/markets/derive.py
          tests/modeling/test_baselines.py
          tests/modeling/test_joint.py
          tests/modeling/test_calibration.py
          tests/modeling/test_registry.py
          --select E,F,I,UP,B,SIM
      - name: Ruff backtest (strict)
        run: >
          ruff check
          src/mma_model/backtest
          src/mma_model/predict/backtest.py
          tests/backtest
          --select E,F,I,UP,B,SIM
      - name: Ruff recommend (strict)
        run: >
          ruff check
          src/mma_model/recommend
          tests/recommend
          --select E,F,I,UP,B,SIM
      - name: Ruff grade (strict)
        run: >
          ruff check
          src/mma_model/db/tables/recommendations.py
          src/mma_model/grade
          src/mma_model/db/grade_guards.py
          tests/grade
          --select E,F,I,UP,B,SIM
      - name: Ruff jobs (strict)
        run: >
          ruff check
          src/mma_model/jobs/orchestrator.py
          src/mma_model/jobs/due.py
          src/mma_model/jobs/handlers.py
          src/mma_model/jobs/ledger.py
          src/mma_model/jobs/types.py
          src/mma_model/db/tables/pipeline_jobs.py
          tests/jobs/test_orchestrator.py
          --select E,F,I,UP,B,SIM
      - name: Ruff observability (strict)
        run: >
          ruff check
          src/mma_model/observability
          tests/observability
          --select E,F,I,UP,B,SIM
      - name: Ruff publish (strict)
        run: >
          ruff check
          src/mma_model/publish
          tests/publish
          src/mma_model/jobs/handlers.py
          src/mma_model/observability/publish_guard.py
          --select E,F,I,UP,B,SIM
      - name: Ruff packaging / deploy (strict)
        run: >
          ruff check
          src/mma_model/publish/public_sync.py
          scripts/check_packaging_secrets.py
          tests/deploy
          --select E,F,I,UP,B,SIM
      - name: Ruff weekly lifecycle (strict)
        run: >
          ruff check
          tests/integration
          tests/fixtures/week_lifecycle
          scripts/run_weekly_smoke.py
          src/mma_model/jobs/handlers.py
          --select E,F,I,UP,B,SIM
      - name: Secret and artifact packaging scan
        run: python scripts/check_packaging_secrets.py
      - name: Dashboard schema codegen check
        run: python -m mma_model.publish.codegen --check
      - name: Pytest
        run: pytest -q -m "not slow"
      - name: Migration clean-install and upgrade/downgrade smoke
        run: pytest -q tests/db/test_migrations.py
      - name: Weekly lifecycle integration
        run: pytest -q tests/integration/test_weekly_pipeline.py
      - name: Web dashboard (lint, typecheck, test, build)
        run: |
          npm --prefix web ci
          npm --prefix web run lint
          npm --prefix web run typecheck
          npm --prefix web run test
          npm --prefix web run build
      - name: Compose config invariants
        run: |
          mkdir -p /tmp/mma-ci-env
          printf 'MMA_DATA_DIR=/data\nMMA_PUBLIC_DIR=/public\n' > /tmp/mma-ci-env/mma.env
          cat > /tmp/mma-ci-compose.override.yaml <<'EOF'
          services:
            worker:
              env_file:
                - /tmp/mma-ci-env/mma.env
          EOF
          docker compose -f deploy/compose.yaml -f /tmp/mma-ci-compose.override.yaml config > /tmp/mma-compose.rendered.yaml
          python - <<'PY'
          import re, sys, yaml
          from pathlib import Path
          raw = Path("deploy/compose.yaml").read_text(encoding="utf-8")
          assert re.search(r"(?m)^\s*ports\s*:", raw) is None
          assert re.search(r"(?m)^\s*expose\s*:", raw) is None
          rendered = yaml.safe_load(Path("/tmp/mma-compose.rendered.yaml").read_text(encoding="utf-8"))
          worker = rendered["services"]["worker"]
          assert not worker.get("ports"), worker.get("ports")
          assert not worker.get("expose"), worker.get("expose")
          assert worker.get("network_mode") != "host"
          print("compose config OK (no ports/expose/host net)")
          PY
      - name: Docker image build (no push)
        run: docker build -t mma-model:ci-pr .
