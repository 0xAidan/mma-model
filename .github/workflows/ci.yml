name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Ruff evaluation (strict)
        run: >
          ruff check
          src/mma_model/evaluation
          tests/test_evaluation_contract.py
          tests/test_evaluation_contract_packaging.py
          --select E,F,I,UP,B,SIM
      - name: Ruff markets (strict)
        run: >
          ruff check
          src/mma_model/domain
          src/mma_model/markets
          tests/markets
          --select E,F,I,UP,B,SIM
      - name: Pytest
        run: pytest -q
