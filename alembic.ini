# Alembic configuration for mma-model (DWCS-100).
# Tests and CLI override sqlalchemy.url to disposable SQLite paths.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

# No implicit database. Set MMA_DATABASE_URL or override sqlalchemy.url explicitly
# (tests / mma-model init-db). Plain `alembic` CLI refuses to guess a target.
sqlalchemy.url = REQUIRED_EXPLICIT_DATABASE_URL

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
