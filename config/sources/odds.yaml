ticket: DWCS-202
phase0_evidence: output/research/odds-coverage-summary.json
decision:
  path: the_odds_api_reference_fallback
  licensed_bookmaker_adapter_authorized: false
  bet365_dwcs_status: scoped_absent
  rationale: >
    Phase 0 (DWCS-000) did not observe Bet365×DWCS for queried aliases on The Odds API
    (scoped_absent). OpticOdds, SportsGameOdds, and SportsDataIO were not_configured.
    No licensed bookmaker-specific provider passed the Phase 0 gate. Do not invent an
    automated bookmaker adapter. Core product uses sportsbook-agnostic fair / actionable /
    strong-value thresholds; optional user_observed prices enable exact EV only.
reference_odds:
  provider: the_odds_api
  role: reference_moneyline_context
  never_label_as_bet365: true
manual_observation:
  source_label: user_observed
  automated: false
  required_for_price_targets: false
  required_for_exact_ev: true
  retention: append_only_local
line_lifecycle_states:
  - available
  - unknown
  - suspended
  - locked
  - removed
  - entitlement_failed
prohibited:
  - sportsbook_website_scraping
  - sportsbook_credential_storage
  - inventing_licensed_adapters_without_phase0_pass
  - forward_filling_locked_or_removed_prices
  - synthetic_ev_roi_clv_without_observed_price
  - labeling_reference_consensus_as_bet365
