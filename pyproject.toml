[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mma-model"
version = "0.1.0"
description = "UFC stats ETL, evolving composites, calibrated win probs, EV vs market odds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
mma-model = "mma_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mma_model.evaluation" = ["dwcs_v1.json"]
"mma_model.identity.data" = ["adjudicated_cases_v1.json"]
"mma_model.markets" = ["settlement_v1.yaml"]
"mma_model.odds" = ["odds_decision_v1.yaml", "matching_v1.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: packaging / install smoke tests (still run in default CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Repository-wide gate stays correctness-first because pre-existing modules carry
# style debt unrelated to DWCS-001. Broader rules are enforced on evaluation code
# via the focused CI command documented below.
select = ["E4", "E7", "E9", "F"]

# Focused stricter lint for DWCS evaluation contract code/tests:
#   ruff check src/mma_model/evaluation tests/test_evaluation_contract.py \
#              tests/test_evaluation_contract_packaging.py \
#              --select E,F,I,UP,B,SIM
# Focused stricter lint for DWCS-200 market contracts:
#   ruff check src/mma_model/domain src/mma_model/markets tests/markets \
#              --select E,F,I,UP,B,SIM
# Focused stricter lint for DWCS-201 odds normalization:
#   ruff check src/mma_model/odds src/mma_model/db/tables/odds.py \
#              src/mma_model/db/odds_guards.py tests/odds \
#              --select E,F,I,UP,B,SIM
# Focused stricter lint for DWCS-203 odds matching / lifecycle:
#   ruff check src/mma_model/odds src/mma_model/db/tables/odds.py \
#              src/mma_model/db/odds_guards.py tests/odds \
#              --select E,F,I,UP,B,SIM
