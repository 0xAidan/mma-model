# DWCS-200 settlement rule contract (versioned, deterministic).
# Authoritative packaged bytes: mma_model/markets/settlement_v1.yaml
# Plan-visible path: config/markets/settlement_v1.yaml (symlink).
#
# Bookmaker lines remain optional enrichment. This file encodes how bets settle
# once an event-night result exists; it does not require a live sportsbook feed.
#
# Content identity: SHA-256 of canonical JSON over this document is pinned in
# mma_model.markets.rules.PINNED_SETTLEMENT_HASH. Any byte/semantic change must
# bump contract_version + rule-set version and update the pinned digest together.
#
# Source research: docs/research/mma-settlement-sources.md (accessed 2026-08-12).
# Sportsbook-agnostic price guidance does not depend on this rule set.

schema_version: 1
contract_id: dwcs_settlement
contract_version: "1.2.0"
default_rule_set_id: mma_generic

rule_sets:
  mma_generic:
    version: "1.2.0"
    status: externally_sourced
    source:
      id: mma_generic_public_house_rules_v1
      citation: >
        Generic DWCS settlement defaults reconciled to publicly accessible
        regulated sportsbook UFC/MMA house-rule pages (Sky Bet, Paddy Power)
        accessed 2026-08-12. Not a claim of universal sportsbook rules.
        Documented disagreements (notably Bodog exact-half void) live in
        versioned overrides. See docs/research/mma-settlement-sources.md.
      references:
        - id: skybet_ufc_mma_rules
          locator: https://support.skybet.com/app/answers/detail/ufc-mma-rules
          role: >
            Moneyline draw void when draw not offered; NC/cancel void; totals
            half-round at 2:30; exact 2:30 grades under; technical decision as
            decision/points
          accessed: "2026-08-12"
        - id: paddypower_ufc_mma_rules
          locator: https://helpcenter.paddypower.com/app/answers/detail/ufc-mma-rules
          role: >
            Match-bet draw void; NC void; totals half-round at 2:30; exact 2:30
            grades under; technical decision as points/decision
          accessed: "2026-08-12"
        - id: dwcs_settlement_source_notes
          locator: docs/research/mma-settlement-sources.md
          role: reconciliation table, disagreements, and override map
          accessed: "2026-08-12"
    moneyline:
      draw: void
      no_contest: void
      cancellation: void
      technical_decision: settle_as_decision
    goes_distance:
      decision_counts_as_goes_distance: true
      technical_decision_counts_as_goes_distance: true
      draw_counts_as_goes_distance: true
      no_contest: void
      cancellation: void
    totals:
      # Half-round lines only. Duration boundary uses elapsed_rounds.
      # Over wins when elapsed_rounds > line; under when elapsed_rounds < line;
      # at exact equality Sky Bet / Paddy Power grade under as the winner.
      half_round_lines: [1.5, 2.5]
      half_round_boundary: elapsed_rounds
      round_seconds: 300
      exact_half_result: under
      decision_uses_full_scheduled_duration: true
      no_contest: void
      cancellation: void
    method:
      technical_decision_counts_as: decision
      draw: void
      no_contest: void
      cancellation: void
    fighter_by_method:
      technical_decision_counts_as: decision
      draw: void
      no_contest: void
      cancellation: void
    exact_round:
      decision: loss
      draw: loss
      technical_decision: loss
      no_contest: void
      cancellation: void

  bodog_mma:
    version: "1.2.0"
    status: externally_sourced
    extends: mma_generic
    source:
      id: bodog_mma_exact_half_void
      citation: >
        Bodog Boxing/MMA rules: at exactly 2:30 of a 5-minute round, total-rounds
        bets are void (disagreement vs Sky Bet / Paddy Power under-at-exact).
      references:
        - id: bodog_boxing_mma_betting_rules
          locator: https://www.bodog.eu/help/common-faq/boxing-mma-betting-rules
          role: totals exact 2:30 void for 5-minute rounds; moneyline draw no action
          accessed: "2026-08-12"
    overrides:
      totals:
        exact_half_result: void

  bet365_mma:
    version: "1.2.0"
    status: provisional_pending_approved_source
    extends: mma_generic
    source:
      id: bet365_mma_rules_pending
      citation: >
        Placeholder sportsbook override lane for Bet365 MMA. Exact Bet365 DWCS
        house rules are not activated until an approved public/licensed rule
        source with durable identifiers is attached. Selecting this rule set
        without allow_provisional hard-fails. Differences versus mma_generic
        remain empty until approved.
      references: []
    overrides: {}
