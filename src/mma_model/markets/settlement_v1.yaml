# DWCS-200 settlement rule contract (versioned, deterministic).
# Authoritative packaged bytes: mma_model/markets/settlement_v1.yaml
# Plan-visible path: config/markets/settlement_v1.yaml (symlink).
#
# Bookmaker lines remain optional enrichment. This file encodes how bets settle
# once an event-night result exists; it does not require a live sportsbook feed.
#
# Content identity: SHA-256 of canonical JSON over this document is pinned in
# mma_model.markets.rules.PINNED_SETTLEMENT_HASH. Any byte/semantic change must
# bump contract_version + rule-set version and update the pinned digest together.
#
# Default rule set status is internal_contract (repo-governed grading rules),
# NOT an approved external sportsbook house-rules source.

schema_version: 1
contract_id: dwcs_settlement
contract_version: "1.1.0"
default_rule_set_id: mma_generic

rule_sets:
  mma_generic:
    version: "1.1.0"
    status: internal_contract
    source:
      id: dwcs_internal_settlement_contract_v1
      citation: >
        Internally governed DWCS settlement contract for deterministic grading
        across moneyline, totals, distance, method, and exact-round markets.
        These rules are repository policy for consistent evaluation — they are
        not an approved external sportsbook house-rules source and must not be
        described as universal sportsbook rules. Sportsbook-agnostic fair /
        actionable / strong-value price guidance remains the required product
        fallback and does not depend on this rule set.
      references:
        - id: dwcs_evaluation_terminal_atoms
          locator: packaged:mma_model/evaluation/dwcs_v1.json
          role: terminal label taxonomy (KO/TKO, submission, decision, other
            stoppage, draw; NC/void settlement-only)
          accessed: "2026-08-12"
        - id: dwcs_data_contracts
          locator: docs/data-contracts.md
          role: repository governing product and settlement documentation
          accessed: "2026-08-12"
        - id: dwcs_adr_0001_boundaries
          locator: docs/adr/0001-dwcs-system-boundaries.md
          role: system boundary that bookmaker odds are optional enrichment
          accessed: "2026-08-12"
    moneyline:
      draw: push
      no_contest: void
      cancellation: void
      technical_decision: settle_as_decision
    goes_distance:
      decision_counts_as_goes_distance: true
      technical_decision_counts_as_goes_distance: true
      draw_counts_as_goes_distance: true
      no_contest: void
      cancellation: void
    totals:
      # v1 offers half-round lines only. Boundary uses fight duration in rounds
      # (ending_round + elapsed_seconds_in_round, or total_elapsed_seconds).
      # Over wins when elapsed_rounds > line; under when elapsed_rounds < line;
      # exact equality (e.g. 2:30 of round 2 for 1.5) is push.
      half_round_lines: [1.5, 2.5]
      half_round_boundary: elapsed_rounds
      round_seconds: 300
      exact_half_result: push
      decision_uses_full_scheduled_duration: true
      no_contest: void
      cancellation: void
    method:
      technical_decision_counts_as: decision
      draw: void
      no_contest: void
      cancellation: void
    fighter_by_method:
      technical_decision_counts_as: decision
      draw: void
      no_contest: void
      cancellation: void
    exact_round:
      # Decision / draw at distance is not a round finish → loss
      decision: loss
      draw: loss
      technical_decision: loss
      no_contest: void
      cancellation: void

  bet365_mma:
    version: "1.1.0"
    status: provisional_pending_approved_source
    extends: mma_generic
    source:
      id: bet365_mma_rules_pending
      citation: >
        Placeholder sportsbook override lane for Bet365 MMA. Exact Bet365 DWCS
        house rules are not activated until an approved public/licensed rule
        source with durable identifiers is attached. Selecting this rule set
        without allow_provisional hard-fails. Differences versus mma_generic
        remain empty until approved.
      references: []
    overrides: {}
